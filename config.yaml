# MiniBot Configuration

# Lark (Feishu) gateway
lark:
  app_id: "${LARK_APP_ID}"
  app_secret: "${LARK_APP_SECRET}"

# Model providers (ordered by priority for fallback)
models:
  providers:
    - name: openai
      api_key: "${OPENAI_API_KEY}"
      base_url: "${OPENAI_BASE_URL}"
      models:
        chat: gpt-4o-mini
        embed: text-embedding-3-small
    - name: gemini
      api_key: "${GEMINI_API_KEY}"
      models:
        chat: gemini-1.5-flash
        embed: text-embedding-004
    - name: nvidia
      api_key: "${NVIDIA_API_KEY}"
      models:
        embed: nvidia/nv-embedqa-e5-v5
  default_provider: openai

# Memory settings
memory:
  db_path: "./data/memory.db"
  top_k: 5
  decay_rate: 0.02        # daily decay rate
  archive_threshold: 0.1   # score below this gets archived
  cleanup_days: 90         # auto-delete archived memories older than this

# Agent settings
agent:
  max_iterations: 20
  timeout_minutes: 30
  reflection_max_rounds: 3
  tot_branches: 3
  tot_depth: 3

# Tool settings
tools:
  shell_timeout: 30        # seconds
  output_max_bytes: 10240  # 10KB
  work_dir: "${MINIBOT_WORK_DIR}"
  search_backend: tavily   # tavily, searxng, google
  search_api_key: "${TAVILY_API_KEY}"

# Skill settings
skills:
  dir: "./skills"

# Logging
logging:
  level: INFO
  file: "./data/minibot.log"
